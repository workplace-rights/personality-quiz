<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>職場人格特質問卷｜五大人格 × MBTI 雙重分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEFF2;
    --sheet:#FFFFFF;
    --ink:#1F2430;
    --ink-soft:#5A6072;
    --line:#CBCFD8;
    --seal:#C8442D;
    --seal-dark:#a8341f;
    --seal-soft:rgba(200,68,45,0.08);
    --dim-stability:#3A6EA5;
    --dim-agreeable:#3F8F66;
    --dim-conscientious:#C68A2E;
    --dim-extraversion:#B5466B;
    --dim-openness:#7A5BA6;
    --font-display:'Noto Serif TC', serif;
    --font-body:'Noto Sans TC', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%),
      repeating-linear-gradient(0deg, rgba(31,36,48,0.025) 0px, rgba(31,36,48,0.025) 1px, transparent 1px, transparent 28px);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.65;
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .wrap{max-width:600px;margin:0 auto;}
  .sheet{
    background:var(--sheet);
    border:1px solid var(--line);
    border-top:4px solid var(--ink);
    box-shadow:0 1px 2px rgba(31,36,48,0.04), 0 12px 28px -16px rgba(31,36,48,0.18);
    padding:36px 28px;
  }
  @media (min-width:480px){ .sheet{padding:44px 40px;} }

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:flex;align-items:center;gap:8px;
    margin-bottom:14px;
  }
  .eyebrow::before{content:"";width:18px;height:1px;background:var(--seal);display:inline-block;}

  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:28px;
    line-height:1.3;
    margin:0 0 14px;
    letter-spacing:.01em;
  }
  .lede{font-size:15px;color:var(--ink-soft);margin:0 0 20px;}

  .meta-row{
    display:flex;flex-wrap:wrap;gap:10px 18px;
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--ink);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:14px 0;
    margin-bottom:26px;
  }
  .meta-row span b{color:var(--seal);}

  .btn{
    appearance:none;border:none;cursor:pointer;
    font-family:var(--font-body);font-weight:700;font-size:15px;
    padding:14px 26px;
    transition:transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease;
    letter-spacing:.01em;
  }
  .btn:focus-visible{outline:2px solid var(--seal);outline-offset:2px;}
  .btn-primary{background:var(--seal);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--seal-dark);}
  .btn-primary:disabled{background:#D8DBE1;color:#9499A6;cursor:not-allowed;}
  .btn-primary:active:not(:disabled){transform:scale(.99);}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  .btn-ghost:hover{background:var(--ink);color:#fff;}
  .btn-ghost:disabled{opacity:.35;cursor:not-allowed;}
  .btn-small{padding:9px 16px;font-size:13px;}

  .disclaimer{
    font-size:12px;color:var(--ink-soft);margin-top:22px;
    border-left:2px solid var(--line);padding-left:12px;
  }

  /* ---- quiz ---- */
  .part-tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--seal);margin-bottom:12px;}
  .progress-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-label{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);letter-spacing:.04em;}
  .progress-track{height:5px;background:var(--line);margin-bottom:34px;position:relative;}
  .progress-fill{height:100%;background:var(--seal);transition:width .35s ease;}

  .timer-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .timer-label{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);letter-spacing:.04em;}
  .timer-display{
    font-family:var(--font-mono);font-size:12.5px;font-weight:700;letter-spacing:.06em;
    color:var(--ink-soft);transition:color .3s;
  }
  .timer-display.urgent{color:var(--seal);animation:timerPulse 1s ease-in-out infinite;}
  @keyframes timerPulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .timer-track{height:4px;background:var(--line);margin-bottom:28px;position:relative;}
  .timer-fill{height:100%;background:var(--ink-soft);transition:width 1s linear;}

  .question-text{
    font-family:var(--font-display);font-weight:600;font-size:21px;
    line-height:1.55;margin:0 0 32px;min-height:108px;
  }

  .bubble-row{display:flex;justify-content:space-between;gap:6px;margin-bottom:30px;}
  .bubble-col{display:flex;flex-direction:column;align-items:center;gap:9px;flex:1;}
  .bubble{
    width:38px;height:38px;border-radius:50%;
    border:2px solid var(--ink);background:transparent;
    font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s,transform .1s;
  }
  .bubble:hover{border-color:var(--seal);}
  .bubble:focus-visible{outline:2px solid var(--seal);outline-offset:2px;}
  .bubble[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:#fff;transform:scale(1.05);}
  .bubble-label{font-size:10.5px;color:var(--ink-soft);text-align:center;line-height:1.3;max-width:64px;}

  .nav-row{display:flex;gap:12px;}
  .nav-row .btn-ghost{flex:0 0 110px;}
  .nav-row .btn-primary{flex:1;}

  /* ---- results ---- */
  .stamp-wrap{display:flex;justify-content:center;margin-bottom:6px;}
  .stamp{
    width:128px;height:128px;border-radius:50%;
    border:3px double var(--seal);color:var(--seal);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--font-mono);text-align:center;
    transform:rotate(-8deg);opacity:.88;mix-blend-mode:multiply;
    animation:stampDown .55s cubic-bezier(.34,1.56,.64,1);
  }
  .stamp b{font-size:15px;letter-spacing:.06em;font-weight:700;}
  .stamp span{font-size:9.5px;letter-spacing:.08em;margin-top:3px;}
  @keyframes stampDown{
    from{transform:rotate(-8deg) scale(2.4);opacity:0;}
    to{transform:rotate(-8deg) scale(1);opacity:.88;}
  }
  @media (prefers-reduced-motion: reduce){ .stamp{animation:none;} }

  .mbti-headline{text-align:center;margin:20px 0 0;}
  .mbti-code{font-family:var(--font-mono);font-weight:700;font-size:46px;letter-spacing:.08em;color:var(--ink);margin:0;}
  .mbti-nickname{font-family:var(--font-display);font-weight:700;font-size:20px;margin:8px 0 4px;color:var(--seal);}
  .mbti-tagline{font-size:13.5px;color:var(--ink-soft);margin:0;}

  .conclusion-box{
    background:var(--seal-soft);
    border-left:3px solid var(--seal);
    padding:18px 18px;
    margin:26px 0 6px;
    font-size:14px;
  }
  .conclusion-box p{margin:0 0 10px;}
  .conclusion-box p:last-child{margin-bottom:0;}

  .section-label{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-soft);margin:34px 0 14px;display:flex;align-items:center;gap:8px;
  }
  .section-label::before{content:"";width:14px;height:1px;background:var(--line);}

  .trait-list{list-style:none;margin:0 0 4px;padding:0;}
  .trait-list li{display:flex;gap:10px;font-size:13.5px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;}
  .trait-list li:first-child{border-top:none;}
  .trait-mark{font-weight:700;flex:0 0 14px;}
  .trait-list.strengths .trait-mark{color:var(--seal);}
  .trait-list.watch .trait-mark{color:var(--ink-soft);}
  .trait-tag{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);flex:0 0 64px;}

  .radar{width:100%;max-width:340px;display:block;margin:0 auto 8px;}
  .radar .grid{fill:none;stroke:var(--line);stroke-width:1;}
  .radar .axis{stroke:var(--line);stroke-width:1;}
  .radar .score{fill:rgba(200,68,45,0.14);stroke:var(--seal);stroke-width:2;}
  .radar .axis-label{font-family:var(--font-mono);font-size:13px;fill:var(--ink-soft);}

  .dim-card{border-top:1px solid var(--line);padding:20px 0;}
  .dim-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .dim-name-wrap{display:flex;align-items:center;gap:9px;}
  .dim-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .dim-name{font-family:var(--font-display);font-weight:700;font-size:16.5px;}
  .dim-score{font-family:var(--font-mono);font-weight:600;font-size:15px;}
  .dim-facets{font-size:11.5px;color:var(--ink-soft);margin:0 0 10px;letter-spacing:.01em;}
  .dim-bar-track{height:8px;background:var(--paper);border:1px solid var(--line);margin-bottom:12px;}
  .dim-bar-fill{height:100%;transition:width .5s ease;}
  .dim-text{font-size:13.5px;color:var(--ink);margin:0;}
  .badge{
    display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;
    padding:3px 8px;border:1px solid currentColor;margin-bottom:8px;
  }
  .badge.high{color:var(--seal);}
  .badge.low{color:var(--ink-soft);}

  .pair-card{border-top:1px solid var(--line);padding:18px 0;}
  .pair-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;margin-bottom:8px;color:var(--ink-soft);}
  .pair-labels .dominant{color:var(--seal);font-weight:700;}
  .pair-track{height:8px;background:var(--line);position:relative;margin-bottom:10px;}
  .pair-fill{height:100%;background:var(--ink);}
  .pair-desc{font-size:13px;color:var(--ink);margin:0;}

  .result-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;}
  .result-actions .btn{flex:1 1 140px;}
  .copy-note{font-family:var(--font-mono);font-size:11.5px;color:var(--seal);margin-top:8px;text-align:center;min-height:14px;}

  /* ---- name / admin fields ---- */
  .field-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:6px;display:block;text-transform:uppercase;}
  .field-input{
    width:100%;font-family:var(--font-body);font-size:15px;color:var(--ink);
    border:1.5px solid var(--line);background:var(--paper);
    padding:12px 14px;margin-bottom:18px;
  }
  .field-input:focus{outline:none;border-color:var(--seal);background:#fff;}
  textarea.field-input{resize:vertical;min-height:90px;font-family:var(--font-mono);font-size:12.5px;line-height:1.5;}
  .error-text{color:var(--seal);font-size:12.5px;margin:-8px 0 16px;}
  .code-box{
    font-family:var(--font-mono);font-size:11.5px;line-height:1.6;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--line);padding:16px;
    word-break:break-all;margin-bottom:16px;max-height:160px;overflow-y:auto;
  }
  .candidate-name{font-family:var(--font-display);font-weight:700;font-size:20px;margin:0 0 4px;}
  .candidate-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);margin:0 0 8px;}
  .mailto-btn{display:block;text-align:center;text-decoration:none;margin-top:12px;}
  .trait-list.flags .trait-mark{color:var(--seal);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DIMENSIONS = [
  { key:'stability', name:'情緒穩定性', short:'情穩', facets:'抗壓性・情緒調適・樂觀性・適應性', color:'var(--dim-stability)', hex:'#3A6EA5',
    archetype:'沉穩抗壓型', archetypeDesc:'越混亂的場面越需要你坐鎮，是團隊裡最穩的那個人。',
    strengthPhrase:'壓力下仍能維持穩定輸出，是團隊的定錨者',
    weaknessPhrase:'在持續高壓或衝突頻繁的環境中，情緒管理與恢復速度可能需要額外留意',
    probe:'面談可請對方描述一次工作中壓力最大的情境，觀察其情緒調節方式與恢復速度，評估職務壓力強度是否匹配。',
    high:'你在壓力下通常能保持冷靜，情緒起伏不大，遇到突發狀況也能快速調整步調繼續推進。這在高壓或衝突頻繁的職務中是非常可貴的特質。',
    mid:'你在多數情境下能維持穩定，但遇到特別緊湊或壓力集中的時期，仍會感受到一定程度的情緒波動，屬於一般範圍。',
    low:'你對壓力與批評較為敏感，情緒較容易受外界影響。在高壓節奏快的工作環境中，情緒管理與自我調適需要特別關注。' },
  { key:'agreeable', name:'親和性', short:'親和', facets:'信任感・利他性・合作性・同情心', color:'var(--dim-agreeable)', hex:'#3F8F66',
    archetype:'溫暖協作型', archetypeDesc:'擅長搭橋，總能讓不同立場的人坐下來好好溝通。',
    strengthPhrase:'擅長建立信任、促進合作，是團隊關係的潤滑劑',
    weaknessPhrase:'可能因過於重視和諧而難以堅守立場，在需要強硬決策時容易退讓',
    probe:'面談可詢問對方曾因立場不同而必須拒絕他人請求的經驗，觀察其設定界限的能力與衝突應對方式。',
    high:'你重視人際和諧，傾向配合他人、避免衝突，是團隊中善於協調的潤滑角色。但在需要堅守立場或做出不討喜決定的情境中，過高的親和性可能讓你難以果斷行動。',
    mid:'你在合作與堅持己見之間能取得平衡，視情境調整應對方式，是較為靈活的合作者。',
    low:'你重視個人判斷與效率，不容易被他人意見左右，在需要獨立評估與決策的角色中是優勢。但在需要大量協作的環境中，可能需要額外留意團隊關係的維繫。' },
  { key:'conscientious', name:'嚴謹性', short:'嚴謹', facets:'秩序性・謹慎性・自律性・責任感', color:'var(--dim-conscientious)', hex:'#C68A2E',
    archetype:'嚴謹執行型', archetypeDesc:'交出去的事大家都放心，說到做到是你最穩的招牌。',
    strengthPhrase:'做事有條理、重視品質，交付成果穩定可靠',
    weaknessPhrase:'在快節奏或高度模糊的環境中，對細節與完美的追求可能造成執行效率下降',
    probe:'面談可請對方描述一個時程緊迫又要求細節的任務，觀察其規劃能力、細心程度，並詢問曾因細節疏漏需要補救的經驗。',
    high:'你做事嚴謹、重視細節與承諾，能持續穩定地完成高品質的工作。在高度結構化的環境中你如魚得水，但當任務要求快速產出或容許模糊時，完美主義的傾向可能讓進度受阻。',
    mid:'你能在品質與效率之間保持合理平衡，大致上能按時交付，同時維持一定的品質標準。',
    low:'你偏好彈性、隨機應變，不喜歡被繁瑣的流程與規則束縛。在需要嚴格紀律、細節確認與按時交付的職務中，這可能是需要刻意補強的方向。' },
  { key:'extraversion', name:'外向性', short:'外向', facets:'社交主動性・活力・表現慾・領導性', color:'var(--dim-extraversion)', hex:'#B5466B',
    archetype:'積極領導型', archetypeDesc:'天生有股推著大家往前走的能量，很難讓人忽視。',
    strengthPhrase:'主動積極、善於表達，能帶動團隊氣氛與能量',
    weaknessPhrase:'在需要長時間獨立深度作業或安靜專注的環境中，持久力可能受影響',
    probe:'面談可觀察對方在口語表達、主動性與現場氣氛帶動上的表現，並詢問其在獨立作業時如何維持專注與持續力。',
    high:'你充滿活力、樂於主動表達與影響他人，在需要高度對外溝通或帶領團隊的職務中非常適合。但長時間需要獨立鑽研的工作對你而言可能較為費力。',
    mid:'你能視場合調整外顯程度，既可以主動發言，也能安靜專注，是適應性較高的工作者。',
    low:'你偏好獨立作業，思考謹慎深入，在需要專注與深度思考的職務中往往有出色表現。在高頻率社交或公開展示的環境中，可能需要額外的心理能量儲備。' },
  { key:'openness', name:'開放性', short:'開放', facets:'求知慾・創造力・彈性・抽象思維', color:'var(--dim-openness)', hex:'#7A5BA6',
    archetype:'創新探索型', archetypeDesc:'總在問「還有沒有更好的方法」，是團隊裡的點子引擎。',
    strengthPhrase:'思維靈活、好奇心旺盛，能為團隊帶來新觀點與創新解法',
    weaknessPhrase:'在需要高度一致性、重複執行標準流程的工作中，耐性與穩定性可能成為挑戰',
    probe:'面談可詢問對方面對流程變革或新工具導入時的反應方式，觀察其學習彈性；同時詢問其在需要重複執行例行任務時如何維持專注與品質。',
    high:'你對新事物充滿好奇，喜歡探索與創新，思考角度多元。在需要創意、適應變化的環境中你能發揮優勢，但面對高度重複、嚴格依循標準的作業環境，可能需要刻意調整心態。',
    mid:'你在創新與穩定之間保持彈性，能接受新方法，也能遵循既有流程，是均衡的學習者。',
    low:'你偏好穩定、已驗證有效的做法，重視可預測性與一致性。這在需要嚴謹遵循標準流程的職務中是優勢，但面對快速變動或需要創新突破的環境，可能需要更多支持與引導。' },
];

const LIKERT = ['非常不同意','不同意','普通','同意','非常同意'];

const MBTI_PAIRS = [
  { key:'EI', left:'E', right:'I', leftLabel:'外向 E', rightLabel:'內向 I',
    leftDesc:'從人際互動與外部世界獲取能量，喜歡邊做邊想、主動表達。',
    rightDesc:'從獨立思考與內在世界獲取能量，喜歡先想清楚再行動、偏好深度而非廣度。' },
  { key:'SN', left:'S', right:'N', leftLabel:'實感 S', rightLabel:'直覺 N',
    leftDesc:'重視具體事實與實際經驗，做事務實、注重細節與可執行性。',
    rightDesc:'重視可能性與抽象連結，擅長看見模式、構想未來與新方案。' },
  { key:'TF', left:'T', right:'F', leftLabel:'思考 T', rightLabel:'情感 F',
    leftDesc:'決策時優先依據邏輯與客觀標準，重視效率與公平的規則。',
    rightDesc:'決策時優先考量人的感受與價值觀，重視和諧與個人意義。' },

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function encodeResult(){
  const payload = JSON.stringify({ n:state.name, t:Date.now(), e:state.elapsedMs, a:state.answers });
  return btoa(unescape(encodeURIComponent(payload)));
}

function decodeResult(code){
  try{
    const json = decodeURIComponent(escape(atob(code.trim())));
    const obj = JSON.parse(json);
    if(!obj || !Array.isArray(obj.a) || obj.a.length!==QUESTIONS.length) return null;
    return obj;
  }catch(e){ return null; }
}

function qualityFlags(answers, elapsedMs){
  const flags=[];
  const counts={};
  answers.forEach(a=>{ if(a!=null) counts[a]=(counts[a]||0)+1; });
  const answered = answers.filter(a=>a!=null).length;
  const maxCount = Math.max(0, ...Object.values(counts));
  if(answered>0 && maxCount/answered >= 0.85){
    flags.push('作答分佈高度集中在單一選項（'+maxCount+'/'+answered+' 題相同），建議留意是否充分閱讀每道題目，可於面談中口頭核對部分題項。');
  }
  if(elapsedMs!=null){
    const mins = elapsedMs/60000;
    if(mins>0 && mins<2.5){
      flags.push('作答時間僅約 '+mins.toFixed(1)+' 分鐘（共 54 題），明顯低於一般填答所需時間，建議面談時當場核對部分回答內容。');
    }
  }
  return flags;
}

function pentagonPoints(cx,cy,r){
  const pts=[];
  for(let i=0;i<5;i++){
    const a=-Math.PI/2 + i*(2*Math.PI/5);
    pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]);
  }
  return pts;
}
function ptsStr(pts){ return pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '); }

function computeBigFive(){
  const sums={}, counts={};
  DIMENSIONS.forEach(d=>{sums[d.key]=0;counts[d.key]=0;});
  QUESTIONS.forEach((q,i)=>{
    if(q.test!=='bigfive') return;
    const raw=state.answers[i]; if(raw==null) return;
    const val=q.rev?(6-raw):raw;
    sums[q.dim]+=val; counts[q.dim]++;
  });
  const scores={};
  DIMENSIONS.forEach(d=>{
    const avg=sums[d.key]/(counts[d.key]||1);
    scores[d.key]=Math.round(((avg-1)/4)*100);
  });
  return scores;
}

function computeGuilford(){
  // dims: depression / cyclothymia / inferiority / aggression / objectivity
  const dims=['depression','cyclothymia','inferiority','aggression','objectivity'];
  const sums={}, counts={};
  dims.forEach(d=>{sums[d]=0;counts[d]=0;});
  QUESTIONS.forEach((q,i)=>{
    if(q.test!=='guilford') return;
    const raw=state.answers[i]; if(raw==null) return;
    const val=q.rev?(6-raw):raw;
    sums[q.dim]+=val; counts[q.dim]++;
  });
  const scores={};
  dims.forEach(d=>{
    const avg=sums[d]/(counts[d]||1);
    scores[d]=Math.round(((avg-1)/4)*100);
  });
  return scores;
}

function guilfordPersonalityType(bf, gf){
  // 基氏五種典型判斷（參考 Y-G 量表邏輯）
  // A型（平均型）：各向度接近中等
  // B型（暴力型）：情緒不穩 + 攻擊性高 + 外向
  // C型（偏左/鎮靜型）：情緒穩定 + 社交適應良好 + 內向安靜
  // D型（右上左下/指導型）：情緒穩定 + 外向活躍 + 攻擊性低 → 領導者
  // E型（怪癖型）：憂鬱 + 自卑 + 內向 + 情緒不穩
  const S=bf.stability, E=bf.extraversion, A=bf.agreeable;
  const dep=gf.depression, cyc=gf.cyclothymia, inf=gf.inferiority,
        agg=gf.aggression, obj=gf.objectivity;
  const unstable=(100-S); // 不穩定分數

  if(agg>=65 && unstable>=55 && E>=50){
    return {type:'B型（暴力型）', desc:'情緒不穩定、攻擊性強、外向衝動。在壓力或衝突情境下容易有激烈反應，需特別評估情緒管理能力與職場適配性。', risk:'high'};
  }
  if(dep>=65 && inf>=60 && E<=45 && unstable>=50){
    return {type:'E型（怪癖型）', desc:'憂鬱傾向明顯、自我評價低、社交退縮、情緒不穩定。在需要主動協作或高強度社交的職務中適配性偏低，建議深入了解心理狀態。', risk:'high'};
  }
  if(S>=65 && E>=60 && agg<=40 && obj>=60){
    return {type:'D型（指導型）', desc:'情緒穩定、積極外向、攻擊性低、客觀理性。具備良好的領導特質，適合需要主動推動與帶領他人的職務。', risk:'low'};
  }
  if(S>=60 && E<=45 && agg<=45 && dep<=40){
    return {type:'C型（鎮靜型）', desc:'情緒穩定、性格安靜內斂、不易衝動。適合需要獨立專注作業的職務，在高壓環境下通常能保持冷靜。', risk:'low'};
  }
  return {type:'A型（平均型）', desc:'各項人格特質均衡，沒有特別突出的高風險或高優勢傾向，屬於一般平均型，需搭配其他面向綜合評估。', risk:'normal'};
}


function computeLie(){
  let total=0, count=0;
  QUESTIONS.forEach((q,i)=>{
    if(q.test!=='lie') return;
    const v=state.answers[i];
    if(v==null) return;
    total+=v; count++;
  });
  if(count===0) return null;
  const avg=total/count;
  const pct=Math.round(((avg-1)/4)*100);
  let level, label, desc;
  if(pct>=75){
    level='high'; label='防衛傾向偏高';
    desc='作答中有較高比例選擇「社會期待」程度最強的選項，建議面談時對部分自我陳述進行口頭核實，了解實際行為與認知之間的落差。';
  } else if(pct>=50){
    level='mid'; label='防衛傾向中等';
    desc='作答中有一定程度的自我美化傾向，屬常見範圍，建議搭配面談問題深入了解。';
  } else {
    level='low'; label='防衛傾向偏低';
    desc='作答傾向誠實承認自身限制，整體填答可信度較高。';
  }
  return {pct, level, label, desc};
}

function computeMBTI(){
  const raw={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  QUESTIONS.forEach((q,i)=>{
    if(q.test!=='mbti') return;
    const v=state.answers[i];
    if(v==null) return;
    raw[q.pole]+=v;
  });
  const pairs=MBTI_PAIRS.map(p=>{
    const l=raw[p.left], r=raw[p.right], total=(l+r)||1;
    const leftPct=Math.round(l/total*100);
    const dominant = l>=r ? p.left : p.right;
    const merged=Object.assign({}, p);
    merged.leftPct=leftPct; merged.rightPct=100-leftPct; merged.dominant=dominant;
    return merged;
  });
  const type = pairs.map(p=>p.dominant).join('');
  return {type, pairs};
}

function buildRadarSVG(scores){
  const cx=170, cy=155, maxR=104;
  const grids=[0.25,0.5,0.75,1].map(f=>'<polygon class="grid" points="'+ptsStr(pentagonPoints(cx,cy,maxR*f))+'"/>').join('');
  const axisPts=pentagonPoints(cx,cy,maxR);
  const axes=axisPts.map(p=>'<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>').join('');
  const scorePts=DIMENSIONS.map((d,i)=>{
    const a=-Math.PI/2+i*(2*Math.PI/5);
    const r=maxR*(scores[d.key]/100);
    return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
  });
  const poly='<polygon class="score" points="'+ptsStr(scorePts)+'"/>';
  const dots=DIMENSIONS.map((d,i)=>'<circle cx="'+scorePts[i][0].toFixed(1)+'" cy="'+scorePts[i][1].toFixed(1)+'" r="4" fill="'+d.hex+'"/>').join('');
  const labelPts=pentagonPoints(cx,cy,maxR*1.26);
  const labels=DIMENSIONS.map((d,i)=>'<text class="axis-label" x="'+labelPts[i][0].toFixed(1)+'" y="'+labelPts[i][1].toFixed(1)+'" text-anchor="middle" dominant-baseline="middle">'+d.short+'</text>').join('');
  return '<svg viewBox="0 0 340 320" class="radar">'+grids+axes+poly+dots+labels+'</svg>';
}

}

function renderAdminReport(){
  const scores   = computeBigFive();
  const gfScores = computeGuilford();
  const gfType   = guilfordPersonalityType(scores, gfScores);
  const lie      = computeLie();
  const mbtiResult = computeMBTI();
  const mbtiInfo   = MBTI_TYPES[mbtiResult.type];
  const qaFlags  = qualityFlags(state.answers, state.elapsedMs);
  const profile  = computeWorkProfile(scores, gfScores, mbtiResult);
  const special  = computeSpecialFlags(state.answers, gfScores);
  const top    = DIMENSIONS.reduce((a,b)=> scores[a.key]>=scores[b.key]?a:b);
  const bottom = DIMENSIONS.reduce((a,b)=> scores[a.key]<=scores[b.key]?a:b);
  const S = scores.stability;
  const stabNote = S>=70?'情緒穩定性偏高（'+S+'），壓力下通常能保持冷靜。'
    :S>=40?'情緒穩定性中等（'+S+'），大多數情境能自我調適，緊湊時期可能有波動。'
    :'情緒穩定性偏低（'+S+'），對壓力較敏感，高壓環境需特別留意。';

  // ── 基氏人格類型顯示 ──
  const gfColor = gfType.risk==='high'?'var(--seal)':gfType.risk==='low'?'#3F8F66':'var(--ink-soft)';
  const gfHtml = `
    <div style="border:2px solid ${gfColor};padding:14px;margin-bottom:8px;">
      <div style="font-family:var(--font-mono);font-size:11px;color:${gfColor};letter-spacing:.08em;margin-bottom:6px;">基氏人格類型</div>
      <div style="font-weight:700;font-size:16px;color:${gfColor};margin-bottom:6px;">${gfType.type}</div>
      <p style="font-size:13px;margin:0;line-height:1.6;">${gfType.desc}</p>
    </div>`;

  // ── 六大能力指標（含說明） ──
  const abilityMeta={
    problemSolving:{label:'問題解決', high:'善於分析情境、整合資訊，能找出有效解法', mid:'具備基本的問題分析能力，複雜情境下可能需要更多支持', low:'面對複雜問題時可能需要更多引導與協助'},
    communication: {label:'溝通協調', high:'表達清晰、善於傾聽，能有效促進跨部門合作', mid:'溝通能力尚可，在特定情境下可能需加強主動性', low:'在溝通表達或協調他人上可能需要特別留意'},
    timeManagement:{label:'時間管理', high:'計畫性強，能有效安排優先順序並準時交付', mid:'整體時程管理尚可，偶爾可能在截止前才進入狀態', low:'在任務規劃與時間把控上需要額外的結構支持'},
    stressResist:  {label:'抗壓能力', high:'在高壓情境下通常能維持穩定輸出，不易崩潰', mid:'多數情況能自我調適，在持續高壓下可能有情緒波動', low:'對壓力的耐受度較低，高壓環境需要適當的支持機制'},
    carefulness:   {label:'細心謹慎', high:'注重細節、交付品質穩定，出錯率低', mid:'整體細心程度尚可，偶爾可能需要加強確認流程', low:'在細節把關上需特別留意，建議搭配明確的確認機制'},
    workStability: {label:'工作穩定性', high:'情緒穩定、行為一致，是可高度依賴的工作夥伴', mid:'整體穩定性良好，在環境變動較大時可能需要適應時間', low:'穩定性有待觀察，建議面談時確認其工作持續性'},
  };
  const abilityHtml=Object.entries(profile.abilities).map(([k,v])=>{
    const color=v>=70?'#3F8F66':v>=45?'#C68A2E':'#B5466B';
    const arrow=v>=70?'▲':v>=45?'—':'▼';
    const meta=abilityMeta[k];
    const note=v>=70?meta.high:v>=45?meta.mid:meta.low;
    return `<div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11.5px;margin-bottom:4px;">
        <span style="font-weight:700;">${meta.label}</span><span style="color:${color};font-weight:700;">${v} ${arrow}</span>
      </div>
      <div style="height:6px;background:var(--line);border-radius:3px;margin-bottom:6px;">
        <div style="height:100%;width:${v}%;background:${color};border-radius:3px;"></div>
      </div>
      <p style="font-size:12px;color:var(--ink-soft);margin:0;line-height:1.5;">${note}</p>
    </div>`;
  }).join('');

  // ── 角色傾向 ──
  const rolesHtml=profile.roles.map(r=>
    `<li><span class="trait-mark">◆</span><span class="trait-tag">〔角色〕</span><span><b>${r.r}</b>　${r.d}</span></li>`
  ).join('');

  // ── 職務適配 ──
  const jobFitHtml=profile.jobFit.map((j,i)=>{
    const bar=Math.min(j.score,100);
    const color=bar>=70?'#3F8F66':bar>=50?'#C68A2E':'#B5466B';

      </div>
      <div style="height:5px;background:var(--line);border-radius:3px;margin-bottom:8px;">
        <div style="height:100%;width:${bar}%;background:${color};border-radius:3px;"></div>
      </div>
      <p style="font-size:12.5px;color:var(--ink);margin:0;line-height:1.6;">${j.note}</p>
    </div>`;
  }).join('');

  // ── 環境 ──
  const envFitHtml=profile.envFit.map(e=>`<li><span class="trait-mark">✓</span><span>${e}</span></li>`).join('');
  const envCautionHtml=profile.envCaution.map(e=>`<li><span class="trait-mark">△</span><span>${e}</span></li>`).join('');

  // ── 特殊傾向 ──
  const specialHtml=special.flags.length
    ?special.flags.map(f=>{
        const color=f.level==='high'?'var(--seal)':'#C68A2E';
        const icon=f.level==='high'?'⚠':'◎';
        return `<li><span class="trait-mark" style="color:${color}">${icon}</span><span class="trait-tag">〔${f.cat}〕</span><span><b>${f.label}</b>　${f.desc}</span></li>`;
      }).join('')
    :`<li><span class="trait-mark">✓</span><span>未偵測到明顯的特殊人格傾向（攻擊、憂鬱、偏執、衝動等）。</span></li>`;

  // ── 優勢與追問 ──
  const strengthHtml=[
    {mark:'＋',tag:'〔Big Five〕',text:top.strengthPhrase},
    {mark:'＋',tag:'〔MBTI〕',text:mbtiInfo.strengths[0]},
    {mark:'＋',tag:'〔MBTI〕',text:mbtiInfo.strengths[1]},
    {mark:'＋',tag:'〔MBTI〕',text:mbtiInfo.strengths[2]},
  ].map(it=>`<li><span class="trait-mark">${it.mark}</span><span class="trait-tag">${it.tag}</span><span>${it.text}</span></li>`).join('');
  const probeHtml=[
    {mark:'▸',tag:'〔Big Five〕',text:bottom.probe},
    {mark:'▸',tag:'〔MBTI〕',text:mbtiInfo.watch[0]},
    {mark:'▸',tag:'〔MBTI〕',text:mbtiInfo.watch[1]},
  ].map(it=>`<li><span class="trait-mark">${it.mark}</span><span class="trait-tag">${it.tag}</span><span>${it.text}</span></li>`).join('');

  const qaFlagsHtml=qaFlags.length
    ?qaFlags.map(f=>`<li><span class="trait-mark">⚠</span><span class="trait-tag">〔作答品質〕</span><span>${f}</span></li>`).join('')
    :`<li><span class="trait-mark">✓</span><span class="trait-tag">〔作答品質〕</span><span>未偵測到明顯的作答異常。</span></li>`;

  const lieHtml=lie?`
    <div class="section-label">社會期待指標</div>
    <ul class="trait-list flags"><li>
      <span class="trait-mark" style="color:${lie.level==='high'?'var(--seal)':lie.level==='mid'?'#C68A2E':'#3F8F66'}">${lie.level==='high'?'⚠':lie.level==='mid'?'◎':'✓'}</span>
      <span class="trait-tag">〔防衛傾向〕</span>
      <span><b>${lie.label}</b>（分數：${lie.pct}）　${lie.desc}</span>
    </li></ul>`:'';

  const cards=DIMENSIONS.map(d=>{
    const s=scores[d.key],b=bandOf(s);
    let badge='';
    if(d.key===top.key) badge='<span class="badge high">★ 突出優勢</span>';
    else if(d.key===bottom.key) badge='<span class="badge low">💡 面談留意</span>';
    return `<div class="dim-card">${badge}
      <div class="dim-head">
        <div class="dim-name-wrap"><span class="dim-dot" style="background:${d.color}"></span><span class="dim-name">${d.name}</span></div>
        <span class="dim-score" style="color:${d.color}">${s} · ${bandLabel(b)}</span>
      </div>
      <p class="dim-facets">${d.facets}</p>
      <div class="dim-bar-track"><div class="dim-bar-fill" style="width:${s}%;background:${d.color}"></div></div>
      <p class="dim-text">${d[b]}</p>

  }).join('');

  // ── 基氏向度細項 ──
  // 基氏向度：標籤式顯示，不直接顯示原始分數
  const gfMeta={
    depression: {label:'情緒動力', posLabel:'正向積極', negLabel:'低落退縮',
      high:'情緒低落或缺乏動力的傾向明顯，建議確認工作環境是否具備足夠的正向支持。',
      mid:'情緒動力屬一般範圍，偶爾可能有情緒低潮，整體尚在可控範圍。',
      low:'情緒正向、充滿動力，對工作和生活整體抱持積極態度。'},
    cyclothymia:{label:'情緒穩定度', posLabel:'情緒穩定', negLabel:'起伏明顯',
      high:'情緒起伏較大，可能在短時間內大起大落，在需要持續穩定輸出的職務中需特別留意。',
      mid:'情緒整體穩定，偶爾可能受外在因素影響，屬一般範圍。',
      low:'情緒變化平穩，不容易因外在因素而大起大落。'},
    inferiority:{label:'自我效能', posLabel:'自信充足', negLabel:'容易退縮',
      high:'對自身能力評估偏向悲觀，在需要主動展現或承擔責任的場合容易退縮。',
      mid:'自我評估屬一般範圍，在熟悉的情境中能發揮能力，陌生挑戰可能稍感不安。',
      low:'自我效能良好，對自身能力有信心，能主動承擔責任與挑戰。'},
    aggression: {label:'情緒反應強度', posLabel:'反應溫和', negLabel:'容易激動',
      high:'在受挫或受批評時，情緒反應較為強烈，可能有衝動言行，需特別確認情緒管理能力。',
      mid:'情緒反應屬一般範圍，通常能控制，偶爾在特定情境下可能有較直接的反應。',
      low:'情緒反應溫和，即使在受挫時也能保持克制，不容易衝動。'},
    objectivity:{label:'客觀判斷力', posLabel:'客觀理性', negLabel:'主觀易疑',
      high:'判斷力客觀理性，能以事實為基礎做出評估，不容易帶入個人情緒或偏見。',
      mid:'判斷力大致客觀，偶爾可能帶入個人觀點，屬一般範圍。',
      low:'較容易帶入主觀判斷或對他人動機存疑，在需要高度信任的協作中需特別留意。'},
  };
  const gfCardsHtml=Object.entries(gfScores).map(([k,v])=>{
    // objectivity: high is good; others: low is good
    const isPositive = k==='objectivity';
    const level = v>=60?'high':v>=35?'mid':'low';
    const displayLevel = isPositive?(level==='high'?'high':level==='mid'?'mid':'low')
                                   :(level==='high'?'low':level==='mid'?'mid':'high');
    const color=displayLevel==='high'?'#3F8F66':displayLevel==='mid'?'#C68A2E':'#B5466B';
    const meta=gfMeta[k];
    const tagLabel=isPositive?(v>=60?meta.posLabel:v>=35?'中等':meta.negLabel)
                             :(v<=40?meta.posLabel:v<=65?'中等':meta.negLabel);
    const note=isPositive?(v>=60?meta.high:v>=35?meta.mid:meta.low)
                         :(v>=60?meta.high:v>=35?meta.mid:meta.low);
    const barWidth=v;
    return `<div class="dim-card">
      <div class="dim-head">
        <span class="dim-name">${meta.label}</span>
        <span class="dim-score" style="color:${color};font-size:13px;">${tagLabel}</span>
      </div>
      <div class="dim-bar-track"><div class="dim-bar-fill" style="width:${barWidth}%;background:${color}"></div></div>
      <p class="dim-text" style="font-size:12px;">${note}</p>
    </div>`;
  }).join('');

  // ── BF dim short summary for overview table ──
  const bfSummaryRows = DIMENSIONS.map(d=>{
    const s=scores[d.key], b=bandOf(s);
    const color=b==='high'?d.color:b==='mid'?'var(--ink-soft)':'#B5466B';
    const shortDesc={
      stability:  {high:'壓力下情緒穩定，反應冷靜', mid:'多數情況穩定，高壓時有波動', low:'對壓力與批評較為敏感'},
      agreeable:  {high:'人際溫和，善於協作與配合', mid:'合作與自主間能取得平衡', low:'偏重個人判斷，不易妥協'},
      conscientious:{high:'計畫性強、細心、重視品質', mid:'整體嚴謹，偶有彈性調整', low:'風格隨性，流程管控需加強'},
      extraversion:{high:'外向主動，善於帶動氣氛', mid:'視場合調整外顯程度', low:'低調內斂，偏好獨立作業'},
      openness:   {high:'思維開放，樂於嘗試與創新', mid:'開放與穩健兼具，均衡靈活', low:'偏好既有做法，適應變化較慢'},
    }[d.key];
    return `<tr>
      <td style="padding:8px 10px;font-weight:600;color:${d.color};white-space:nowrap;">${d.name}</td>
      <td style="padding:8px 10px;font-family:var(--font-mono);font-weight:700;color:${color};">${s}</td>
      <td style="padding:8px 10px;color:${color};font-size:12px;">${bandLabel(b)}</td>
      <td style="padding:8px 10px;font-size:12px;color:var(--ink);">${shortDesc[b]}</td>
    </tr>`;
  }).join('');

  return `
  <div class="sheet">
    <div class="eyebrow">ADMIN REPORT · 應試者報告</div>
    <p class="candidate-name">${escapeHtml(state.name)||'（未填寫姓名）'}</p>
    <p class="candidate-meta">提交時間　${formatDateTime(state.submittedAt)}　・　作答耗時　${formatElapsed(state.elapsedMs)}</p>

    <div class="conclusion-box">
      <p><b>整體人格特質</b>　五大人格中「<b>${top.name}</b>」最為突出：${top.archetypeDesc}</p>
      <p style="margin-top:6px;"><b>MBTI 風格傾向</b>　${mbtiResult.type}「${mbtiInfo.nickname}」──${mbtiInfo.tagline}</p>
      <p style="margin-top:6px;"><b>基氏類型</b>　<span style="color:${gfType.risk==='high'?'var(--seal)':gfType.risk==='low'?'#3F8F66':'var(--ink)'};">${gfType.type}</span>　${gfType.desc}</p>
      <p style="margin-top:6px;font-size:12.5px;color:var(--ink-soft);">${stabNote}</p>
    </div>

    <div class="section-label">特殊傾向提醒</div>
    <ul class="trait-list flags">${specialHtml}</ul>
    <p class="disclaimer" style="margin-top:0;font-size:11.5px;">本項目依填答推算，僅為輔助觀察，不應單獨作為判斷依據。</p>

    <div class="section-label">六大職場能力指標</div>
    ${abilityHtml}

    <div class="section-label">組織角色傾向</div>
    <ul class="trait-list">${rolesHtml}</ul>

    <div class="section-label">職務類型適配建議</div>
    ${jobFitHtml}

    <div class="section-label">期望 vs 不適合的工作環境</div>
    <ul class="trait-list strengths">${envFitHtml}</ul>
    <ul class="trait-list watch">${envCautionHtml}</ul>

    <div class="section-label">工作優勢</div>
    <ul class="trait-list strengths">${strengthHtml}</ul>

    <div class="section-label">面談建議追問方向</div>
    <ul class="trait-list watch">${probeHtml}</ul>

    ${lieHtml}

    <div class="section-label">作答品質提醒</div>
    <ul class="trait-list flags">${qaFlagsHtml}</ul>

    <div class="section-label">細項分析・五大人格特質</div>
    ${buildRadarSVG(scores)}
    <table style="width:100%;border-collapse:collapse;margin-bottom:16px;font-family:var(--font-body);">
      <thead><tr style="border-bottom:1.5px solid var(--line);">
        <th style="padding:6px 10px;text-align:left;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);">向度</th>
        <th style="padding:6px 10px;text-align:left;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);">分數</th>
        <th style="padding:6px 10px;text-align:left;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);">等級</th>
        <th style="padding:6px 10px;text-align:left;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);">說明</th>
      </tr></thead>
      <tbody>${bfSummaryRows}</tbody>
    </table>
    ${cards}

    <div class="section-label">細項分析・基氏人格向度</div>
    ${gfCardsHtml}

    <div class="section-label">細項分析・MBTI 四個向度</div>
    ${mbtiResult.pairs.map(buildPairRow).join('')}

    <p class="disclaimer">本報告整合 Big Five、基氏人格向度與 MBTI 三套模型，為工作風格參考工具，並非正式心理衡鑑，亦非誠信測驗或測謊工具，不應作為錄用與否的單一依據，建議搭配面談與其他評估方式綜合判斷。</p>
    <div class="result-actions">
      <button class="btn btn-ghost btn-small" id="copyBtn">複製報告文字</button>
      <button class="btn btn-primary btn-small" id="sendEmailBtn">寄送報告至信箱</button>
      <button class="btn btn-ghost btn-small" id="nextCandidateBtn">解析下一份代碼</button>
    </div>
    <div class="copy-note" id="copyNote"></div>
  </div>`;
}


function buildAdminSummaryText(){
  const scores   = computeBigFive();
  const gfScores = computeGuilford();
  const gfType   = guilfordPersonalityType(scores, gfScores);
  const lie      = computeLie();
  const mbtiResult = computeMBTI();
  const mbtiInfo   = MBTI_TYPES[mbtiResult.type];
  const profile  = computeWorkProfile(scores, gfScores, mbtiResult);
  const special  = computeSpecialFlags(state.answers, gfScores);
  const top    = DIMENSIONS.reduce((a,b)=> scores[a.key]>=scores[b.key]?a:b);
  const bottom = DIMENSIONS.reduce((a,b)=> scores[a.key]<=scores[b.key]?a:b);
  const qaFlags= qualityFlags(state.answers, state.elapsedMs);
  const S=scores.stability;
  const stabNote=S>=70?'偏高（'+S+'）情緒穩定，適合高壓職務。'
    :S>=40?'中等（'+S+'）大多能自我調適，緊湊時期可能有波動。'
    :'偏低（'+S+'）對壓力較敏感，高壓環境需特別留意。';

  let lines=['【工作風格問卷－應試者報告】','',
    '姓名：'+(state.name||'（未填寫）'),
    '提交時間：'+formatDateTime(state.submittedAt),
    '作答耗時：'+formatElapsed(state.elapsedMs),'',
    '── 基氏人格類型 ──',
    gfType.type, gfType.desc,'',
    '── MBTI 類型 ──',
    mbtiResult.type+'（'+mbtiInfo.nickname+'）', mbtiInfo.tagline,'',
    '── 五大人格特質 ──'];
  DIMENSIONS.forEach(d=>{const s=scores[d.key];lines.push('　'+d.name+'：'+s+'（'+bandLabel(bandOf(s))+'）');});
  lines.push('　情緒穩定度：'+stabNote);
  lines.push('','── 基氏向度 ──',
    '　憂鬱傾向：'+gfScores.depression,
    '　情緒循環性：'+gfScores.cyclothymia,
    '　自卑傾向：'+gfScores.inferiority,
    '　攻擊傾向：'+gfScores.aggression,
    '　客觀性：'+gfScores.objectivity);
  lines.push('','── 六大職場能力 ──');
  const al={problemSolving:'問題解決',communication:'溝通協調',timeManagement:'時間管理',
    stressResist:'抗壓能力',carefulness:'細心謹慎',workStability:'工作穩定性'};
  Object.entries(profile.abilities).forEach(([k,v])=>lines.push('　'+al[k]+'：'+v));
  lines.push('','── 職務適配排名 ──');
  profile.jobFit.forEach((j,i)=>lines.push('　'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':'  ')+' '+j.type+'（'+j.score+'）　'+j.note));
  lines.push('','── 組織角色傾向 ──');
  profile.roles.forEach(r=>lines.push('　◆ '+r.r+'　'+r.d));
  if(special.flags.length){
    lines.push('','── 特殊傾向提醒 ──');
    special.flags.forEach(f=>lines.push('　'+(f.level==='high'?'⚠':'◎')+' '+f.label+'　'+f.desc));
  }
  lines.push('','── 工作優勢 ──','　＋ '+top.strengthPhrase);
  mbtiInfo.strengths.forEach(s=>lines.push('　＋ '+s));
  lines.push('','── 面談建議追問方向 ──','　▸ '+bottom.probe);
  mbtiInfo.watch.forEach(s=>lines.push('　▸ '+s));
  if(lie){lines.push('','── 社會期待指標 ──','　'+lie.label+'（'+lie.pct+'）　'+lie.desc);}
  lines.push('','── 作答品質 ──');
  if(qaFlags.length){qaFlags.forEach(f=>lines.push('　⚠ '+f));}
  else{lines.push('　✓ 未偵測到明顯的作答異常。');}
  lines.push('','本報告僅供面談前參考，非錄用唯一依據。');
  return lines.join('\n');
}


function sendReportEmail(onSuccess, onError){
  const reportText = buildAdminSummaryText();
  const params = {
    candidate_name : state.name || '（未填寫）',
    submitted_at   : formatDateTime(state.submittedAt),
    elapsed        : formatElapsed(state.elapsedMs),
    report_text    : reportText
  };
  // 懶載入 EmailJS SDK（僅在第一次寄信時載入，不影響問卷開啟速度）
  function doSend(){
    window.emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
    window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)
      .then(() => onSuccess())
      .catch(err => onError(err));
  }
  if(window.emailjs){ doSend(); return; }
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js';
  script.onload = doSend;
  script.onerror = () => onError(new Error('EmailJS SDK 載入失敗，請確認網路連線'));
  document.head.appendChild(script);
}

function computeWorkProfile(scores, gfScores, mbtiResult){
  const S=scores.stability, A=scores.agreeable, C=scores.conscientious,
        E=scores.extraversion, O=scores.openness;
  const dep=gfScores.depression, cyc=gfScores.cyclothymia,
        inf=gfScores.inferiority, agg=gfScores.aggression, obj=gfScores.objectivity;

  const abilities={
    problemSolving : Math.round(O*0.40+C*0.35+obj*0.15+S*0.10),
    communication  : Math.round(E*0.35+A*0.35+S*0.20+(100-agg)*0.10),
    timeManagement : Math.round(C*0.55+S*0.25+(100-cyc)*0.10+E*0.10),
    stressResist   : Math.round(S*0.50+C*0.20+(100-dep)*0.20+(100-cyc)*0.10),
    carefulness    : Math.round(C*0.50+S*0.20+O*0.20+obj*0.10),
    workStability  : Math.round(S*0.35+C*0.25+(100-dep)*0.20+(100-cyc)*0.15+(100-agg)*0.05),
  };

  const roles=[];
  if(E>=65&&S>=60&&agg<=50) roles.push({r:'領導推動者',d:'情緒穩定、積極外向、攻擊性受控，具備帶領團隊的特質，適合主管或專案負責人角色。'});
  if(A>=65&&E>=50&&obj>=55) roles.push({r:'溝通協調者',d:'親和力高、客觀理性，善於化解衝突與建立共識，是跨部門溝通的天然橋梁。'});
  if(C>=70&&O<=60&&dep<=45) roles.push({r:'精實執行者',d:'嚴謹自律、細節把關能力強，是可靠的流程守護者，適合需要高度責任感的職務。'});
  if(O>=65&&E>=50&&cyc<=50) roles.push({r:'創新發想者',d:'思維開放、情緒穩定，擅長提出新觀點與突破框架，適合創意或變革推動型職務。'});
  if(C>=65&&A>=60&&E<=55&&dep<=45) roles.push({r:'專業顧問型',d:'深度思考、嚴謹分析，擅長在幕後提供高品質建議，適合需要專業判斷的支援角色。'});
  if(A>=70&&S>=55&&E<=55&&inf<=45) roles.push({r:'支持陪伴者',d:'親和、穩定、自我效能良好，善於傾聽與關懷，適合人資、培訓或輔導角色。'});
  if(roles.length===0) roles.push({r:'均衡適應者',d:'各向度分佈均衡，能視職務需求彈性調整角色定位。'});

  const jobFit=[
    {type:'業務／客服／門市',
     score:Math.round(E*0.30+A*0.25+S*0.25+(100-agg)*0.10+(100-inf)*0.10),
     note:E>=60&&A>=55&&S>=50&&agg<=55
       ?'適配度高：外向性與親和性良好，情緒穩定，能主動建立客戶關係並維持服務品質。'
       :agg>=65?'⚠ 留意：攻擊傾向偏高，在高頻率客訴或衝突情境中的情緒管理需特別確認。'
       :E<50?'留意：外向性偏低，在需要大量主動開發或持續社交的業務型職務中，能量消耗可能較大。'
       :'整體適配中等，建議面談時確認其對外互動的意願與表現。'},
    {type:'研發／工程／技術',
     score:Math.round(O*0.30+C*0.35+S*0.20+(100-dep)*0.15),
     note:O>=60&&C>=65&&dep<=45
       ?'適配度高：開放性與嚴謹性兼備，情緒穩定，能獨立深度作業並持續精進技術能力。'
       :dep>=65?'⚠ 留意：憂鬱傾向偏高，在需要長時間獨立作業的技術職務中，動力維持需特別關注。'
       :C<55?'留意：嚴謹性偏低，在需要細節確認與品質管控的技術職務中需特別留意。'
       :'整體適配中等，建議確認其對獨立作業與技術學習的偏好。'},
    {type:'後勤行政／人資／財務',
     score:Math.round(C*0.35+S*0.30+A*0.20+(100-cyc)*0.15),
     note:C>=70&&S>=55&&cyc<=50
       ?'適配度高：嚴謹、穩定、情緒不易大起大落，適合需要細心、可靠與高度責任感的後勤職務。'
       :cyc>=65?'留意：情緒循環性偏高，在需要持續穩定輸出的行政財務類職務中，情緒波動可能影響工作品質。'
       :C<55?'留意：嚴謹性偏低，在需要高度細節確認與規範遵循的行政財務類職務中可能有落差。'
       :'整體適配中等，建議確認其對結構化工作的接受度。'},
    {type:'管理職／主管',
     score:Math.round(S*0.30+E*0.20+A*0.20+obj*0.15+(100-agg)*0.15),
     note:S>=65&&E>=55&&obj>=55&&agg<=50
       ?'適配度高：情緒穩定、具主動性、客觀理性、攻擊性受控，具備帶領團隊的基本特質。'
       :agg>=65?'⚠ 留意：攻擊傾向偏高，在需要示範情緒管理與帶領他人的管理職中，需審慎評估。'
       :S<55?'留意：情緒穩定性偏低，在需要持續承壓並帶領團隊的管理職中，自我調適能力需特別確認。'
       :'整體適配中等，建議面談時確認其領導經驗與團隊管理風格。'},
    {type:'企劃／行銷／創意',
     score:Math.round(O*0.35+E*0.30+A*0.20+(100-dep)*0.15),
     note:O>=65&&E>=50&&dep<=45
       ?'適配度高：開放性與表達力兼具，情緒穩定，能持續產出創意並有效溝通想法。'
       :dep>=65?'留意：憂鬱傾向偏高，在需要持續創意輸出與積極展現的企劃行銷職務中，動力維持需關注。'
       :O<55?'留意：開放性偏低，在需要持續創新與接受模糊任務的企劃類職務中可能較不適應。'
       :'整體適配中等，建議確認其創意表現方式與溝通風格。'},
  ];
  jobFit.sort((a,b)=>b.score-a.score);

  const envFit=[];
  if(S>=65) envFit.push('可承受高壓與緊湊節奏的工作環境');
  if(C>=70) envFit.push('有明確規則、流程與目標的結構化環境');
  if(E>=65) envFit.push('需要大量對外互動與溝通的外向型環境');
  if(O>=65) envFit.push('鼓勵創新、允許嘗試的開放型環境');
  if(A>=65&&E<=60) envFit.push('合作氣氛良好、衝突少的和諧型環境');
  if(E<=40) envFit.push('能獨立作業、減少頻繁打擾的專注型環境');
  if(envFit.length===0) envFit.push('對多種工作環境均有一定適應能力');

  const envCaution=[];
  if(S<=45||dep>=65) envCaution.push('長期高壓、頻繁衝突或缺乏支持的高壓職務');
  if(C<=40) envCaution.push('需要嚴格遵守細節、高度重複執行標準流程的職務');
  if(E<=35) envCaution.push('需要持續主動對外開發或高頻社交的業務類職務');
  if(O<=35) envCaution.push('需要大量創新發想、快速因應變化的新創型職務');
  if(agg>=65) envCaution.push('頻繁衝突、高強度競爭或需要高度情緒克制的服務型職務');
  if(envCaution.length===0) envCaution.push('未偵測到明顯不適配的環境類型');

  return {abilities, roles, jobFit, envFit, envCaution};
}


function computeSpecialFlags(answers, gfScores){
  const calc=(flagName)=>{
    let sum=0,count=0;
    QUESTIONS.forEach((q,i)=>{
      const v=answers[i]; if(v==null||q.flag!==flagName) return;
      const val=q.rev?v:(6-v); sum+=val; count++;
    });
    return count>0?Math.round(((sum/count)-1)/4*100):0;
  };
  const impulsePct   = calc('impulse');
  const sensitivePct = calc('sensitive');
  const paranoidPct  = calc('paranoid');
  const aggPct       = gfScores.aggression;
  const depPct       = gfScores.depression;
  const infPct       = gfScores.inferiority;

  const flags=[];
  if(aggPct>=70)
    flags.push({level:'high',cat:'攻擊傾向',label:'⚠ 攻擊傾向偏高',
      desc:'填答顯示在受到刺激時有較強的攻擊或報復傾向，可能在衝突情境下做出強烈反應。建議面談時評估其情緒管理方式，並審慎評估是否適合需要頻繁處理衝突的職務。'});
  else if(aggPct>=55)
    flags.push({level:'mid',cat:'攻擊傾向',label:'攻擊傾向中等偏高',
      desc:'在受到挫折或不公平對待時，可能有較明顯的情緒反應，建議面談時觀察其壓力應對方式。'});

  if(impulsePct>=70)
    flags.push({level:'high',cat:'衝動控制',label:'衝動控制需留意',
      desc:'填答顯示在情緒高漲或受到刺激時，較難立即克制反應，有時可能說出或做出事後後悔的行為。'});
  else if(impulsePct>=50)
    flags.push({level:'mid',cat:'衝動控制',label:'衝動傾向中等',
      desc:'偶爾在壓力下可能有較直接的情緒反應，屬一般範圍，建議觀察面談當下的情緒管理表現。'});

  if(depPct>=70)
    flags.push({level:'high',cat:'憂鬱傾向',label:'⚠ 憂鬱傾向偏高',
      desc:'填答顯示有明顯的情緒低落、無意義感或孤立感，可能影響工作動力與穩定性。建議面談時關注其情緒狀態，並評估職務壓力強度的適配性。'});
  else if(depPct>=55)
    flags.push({level:'mid',cat:'憂鬱傾向',label:'憂鬱傾向中等',
      desc:'有一定程度的情緒低潮傾向，在高壓或孤立的工作環境中可能加重，建議留意工作環境的支持性。'});

  if(infPct>=70)
    flags.push({level:'high',cat:'自卑傾向',label:'自我效能偏低',
      desc:'填答顯示對自身能力的評估較為悲觀，容易在需要表現的場合退縮。在需要主動展現能力或承擔責任的職務中，可能需要更多支持與鼓勵。'});

  if(paranoidPct>=70)
    flags.push({level:'high',cat:'偏執傾向',label:'⚠ 疑心／偏執傾向偏高',
      desc:'填答顯示對他人動機有較高的懷疑傾向，容易感覺被針對。在需要高度信任的團隊合作職務中適配性偏低，強烈建議面談時深入評估人際互動模式。'});
  else if(paranoidPct>=55)
    flags.push({level:'mid',cat:'偏執傾向',label:'偏執傾向中等偏高',
      desc:'對人際關係有一定程度的謹慎或防衛，在競爭性環境中可能加重，建議面談時留意其敘述他人的方式。'});

  if(sensitivePct>=70)
    flags.push({level:'high',cat:'人際敏感',label:'人際敏感度偏高',
      desc:'對他人的評價與言行反應較為敏銳，容易在人際互動中感到不安。在需要頻繁接受外部評價的職務中需特別留意。'});

  return {flags, impulsePct, sensitivePct, paranoidPct, aggPct, depPct, infPct};
}

function render(){
  const app=document.getElementById('app');
  if(state.screen==='intro') app.innerHTML=renderIntro();
  else if(state.screen==='quiz') app.innerHTML=renderQuiz();
  else if(state.screen==='thankyou') app.innerHTML=renderThankYou();
  else if(state.screen==='adminLogin') app.innerHTML=renderAdminLogin();
  else if(state.screen==='adminPaste') app.innerHTML=renderAdminPaste();
  else app.innerHTML=renderAdminReport();
  bind();
}

function bind(){
  if(state.screen==='intro'){
    const nameInput=document.getElementById('nameInput');
    const startBtn=document.getElementById('startBtn');
    nameInput.addEventListener('input',()=>{
      state.name=nameInput.value;
      startBtn.disabled=state.name.trim()==='';
    });
    startBtn.addEventListener('click',()=>{
      if(state.name.trim()==='') return;
      state.startTime=Date.now();
      state.screen='quiz'; state.qIndex=0; render();
    });
  } else if(state.screen==='quiz'){
    document.querySelectorAll('.bubble').forEach(btn=>{
      btn.addEventListener('click',()=>{
        state.answers[state.qIndex]=parseInt(btn.dataset.val,10);
        render();
      });
    });
    document.getElementById('prevBtn').addEventListener('click',()=>{
      if(state.qIndex>0){ state.qIndex--; render(); }
    });
    document.getElementById('nextBtn').addEventListener('click',()=>{
      if(state.answers[state.qIndex]==null) return;
      if(state.qIndex<QUESTIONS.length-1){ state.qIndex++; render(); }
      else { submitQuiz(); }
    });
    clearQuizTimer();
    state.timerId=setInterval(()=>{
      const elapsed=state.startTime?Date.now()-state.startTime:0;
      const remaining=Math.max(0,QUIZ_LIMIT_MS-elapsed);
      const remSec=Math.ceil(remaining/1000);
      const remMin=Math.floor(remSec/60),remSecPart=remSec%60;
      const timerStr=String(remMin).padStart(2,'0')+':'+String(remSecPart).padStart(2,'0');
      const timerPct=(remaining/QUIZ_LIMIT_MS*100).toFixed(1);
      const urgent=remaining<=60000;
      const disp=document.getElementById('timerDisplay');
      const fill=document.getElementById('timerFill');
      if(disp){ disp.textContent=timerStr; disp.className='timer-display'+(urgent?' urgent':''); }
      if(fill){ fill.style.width=timerPct+'%'; }
      if(remaining<=0){ submitQuiz(); }
    },1000);
  } else if(state.screen==='thankyou'){
    clearQuizTimer();
  } else if(state.screen==='adminLogin'){
    document.getElementById('loginBtn').addEventListener('click',()=>{
      const val=document.getElementById('pwInput').value;
      if(val===ADMIN_PASSWORD){ state.loginError=''; state.screen='adminPaste'; }
      else { state.loginError='密碼不正確，請重新輸入。'; }
      render();
    });
  } else if(state.screen==='adminPaste'){
    document.getElementById('decodeBtn').addEventListener('click',()=>{
      const raw=document.getElementById('codeInput').value;
      const obj=decodeResult(raw);
      if(!obj){ state.decodeError='代碼格式錯誤或不完整，請確認完整複製貼上。'; render(); return; }
      state.decodeError='';
      state.name=obj.n||'';
      state.elapsedMs=obj.e||null;
      state.submittedAt=obj.t||null;
      state.answers=obj.a;
      state.screen='adminReport';
      render(); window.scrollTo({top:0,behavior:'smooth'});
    });
  } else {
    document.getElementById('nextCandidateBtn').addEventListener('click',()=>{
      state.decodeError=''; state.answers=new Array(QUESTIONS.length).fill(null);
      state.name=''; state.elapsedMs=null; state.submittedAt=null;
      state.screen='adminPaste'; render(); window.scrollTo({top:0,behavior:'smooth'});
    });
    document.getElementById('copyBtn').addEventListener('click',()=>{
      const text=buildAdminSummaryText();
      const note=document.getElementById('copyNote');
      navigator.clipboard.writeText(text).then(()=>{
        note.textContent='已複製到剪貼簿';
        setTimeout(()=>note.textContent='',2200);
      }).catch(()=>{ note.textContent='複製失敗，請手動選取文字'; });
    });
    document.getElementById('sendEmailBtn').addEventListener('click',()=>{
      const btn=document.getElementById('sendEmailBtn');
      const note=document.getElementById('copyNote');
      if(!EMAILJS_PUBLIC_KEY||!EMAILJS_SERVICE_ID||!EMAILJS_TEMPLATE_ID){
        note.textContent='⚠ 尚未填入 EmailJS 設定。'; return;
      }
      btn.disabled=true; btn.textContent='寄送中…'; note.textContent='';
      sendReportEmail(
        ()=>{ btn.textContent='✓ 已寄出'; note.textContent='報告已成功寄送至您的信箱';
          setTimeout(()=>{ btn.disabled=false; btn.textContent='寄送報告至信箱'; note.textContent=''; },4000); },
        (err)=>{ btn.disabled=false; btn.textContent='寄送報告至信箱';
          note.textContent='⚠ 寄送失敗：'+(err&&err.text||err||'未知錯誤'); }
      );
    });
  }
}
